<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵刃 VS 影狐</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-panel" aria-label="灵刃 VS 影狐小游戏">
        <div class="topbar">
          <div class="brand">
            <span class="mark"></span>
            <div>
              <p class="kicker">原创同人风 2D 格斗原型</p>
              <h1>灵刃 VS 影狐</h1>
            </div>
          </div>
          <div class="actions">
            <button id="modeButton" type="button">单人模式</button>
            <button id="restartButton" type="button">重新开始</button>
          </div>
        </div>

        <canvas id="game" width="1280" height="720"></canvas>

        <div class="hud" aria-live="polite">
          <div class="fighter-card left">
            <strong>灵刃剑士</strong>
            <span>P1: A/D 移动 · W 跳 · J/K/L 攻击 · S 格挡 · 空格冲刺</span>
          </div>
          <div class="round-state" id="roundState">按任意攻击键开战</div>
          <div class="fighter-card right">
            <strong>影狐忍者</strong>
            <span>P2: ←/→ 移动 · ↑ 跳 · 1/2/3 攻击 · ↓ 格挡 · 0 冲刺</span>
          </div>
        </div>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
